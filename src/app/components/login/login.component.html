<main class="auth-page">
  <section class="auth-panel">
    <div class="brand">
      <span class="brand-mark">GS</span>
      <div>
        <h1>Geo Scratcher</h1>
        <p>Sign in to continue exploring your map progress.</p>
      </div>
    </div>

    <form *ngIf="!isForgotPassword" [formGroup]="loginForm" (ngSubmit)="login()" class="auth-form">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <small *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid">Enter a valid email.</small>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>
      <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">Password is required.</small>

      <button type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Signing in...' : 'Sign in' }}</button>
      <button type="button" class="link-button" (click)="showForgotPassword()">Forgot password?</button>
    </form>

    <form *ngIf="isForgotPassword && !isResetPassword" [formGroup]="forgotForm" (ngSubmit)="forgotPassword()" class="auth-form">
      <label>
        Account email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <small *ngIf="forgotForm.controls.email.touched && forgotForm.controls.email.invalid">Enter a valid email.</small>

      <button type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Preparing...' : 'Prepare reset' }}</button>
      <button type="button" class="link-button" (click)="showLogin()">Back to sign in</button>
    </form>

    <form *ngIf="isForgotPassword && isResetPassword" [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="auth-form">
      <label>
        Reset token
        <input type="text" formControlName="token" autocomplete="off" />
      </label>
      <label>
        New password
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <small *ngIf="resetForm.controls.password.touched && resetForm.controls.password.invalid">Use at least 8 characters.</small>

      <button type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Resetting...' : 'Reset password' }}</button>
      <button type="button" class="link-button" (click)="showLogin()">Back to sign in</button>
    </form>

    <p *ngIf="message" class="message">{{ message }}</p>
    <p *ngIf="resetToken" class="token">Dev reset token: {{ resetToken }}</p>
    <p *ngIf="error" class="error">{{ error }}</p>

    <p class="switch">New here? <a routerLink="/register">Create an account</a></p>
  </section>
</main>

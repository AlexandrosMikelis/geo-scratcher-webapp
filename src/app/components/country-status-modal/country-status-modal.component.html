<div class="modal-background" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <p class="eyebrow">Country status</p>
      <h2>{{ country?.title }}</h2>
      <div class="status-actions">
        <button class="visited" (click)="selectStatus('visited')">Visited</button>
        <button class="lived" (click)="selectStatus('lived')">Lived in</button>
        <button class="future" (click)="selectStatus('future')">Future travel</button>
      </div>
      <button class="close-button" (click)="close()">Close</button>
    </div>
</div>

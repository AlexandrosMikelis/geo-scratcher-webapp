<app-globe-explorer
  class="globe-host"
  [visited]="visitedIds"
  (countrySelected)="onCountrySelected($event)"
></app-globe-explorer>

<app-country-status-modal
  *ngIf="showModal"
  [country]="selectedCountry"
  (statusSelected)="setCountryStatus($event.country, $event.status)"
  (closeModal)="closeModal()"
></app-country-status-modal>

@if (saveMessage) {
  <div class="save-toast">{{ saveMessage }}</div>
}
